<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="todo-container">

        <!-- Header -->
        <header class="todo-header">

            <div>
                <p class="welcome-text">Stay organized</p>

                <h1>My To-Do List</h1>

                <p class="subtitle">
                    Organize your day, one task at a time.
                </p>
            </div>

            <div class="task-counter">
                <span id="taskCount">0</span>
                <small>Tasks</small>
            </div>

        </header>


        <!-- Add Task -->
        <section class="input-section">

            <input
                type="text"
                id="taskInput"
                placeholder="What do you need to do?"
                autocomplete="off"
            >

            <button type="button" id="addTaskBtn">
                + Add Task
            </button>

        </section>


        <!-- Task List -->
        <section class="tasks-section">

            <div class="section-heading">
                <h2>My Tasks</h2>

                <button
                    type="button"
                    id="clearCompletedBtn"
                    class="clear-btn"
                >
                    Clear Completed
                </button>
            </div>

            <ul id="taskList"></ul>

            <!-- Empty message -->
            <div id="emptyMessage" class="empty-message">

                <div class="empty-icon">✓</div>

                <h3>No tasks yet</h3>

                <p>
                    Add your first task and start being productive.
                </p>

            </div>

        </section>


        <!-- Footer -->
        <footer class="todo-footer">
            <p>Built with HTML, CSS & JavaScript</p>
        </footer>

    </main>


    <script src="script.js"></script>

</body>
</html>
